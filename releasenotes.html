  <style>
    :root{color-scheme:dark;--bg:#171b20;--panel:#20262d;--panel2:#252d35;--line:#39434d;--text:#edf1ee;--dim:#b0bbb5;--faint:#87938d;--gold:#d8b36c;--green:#9bc9a6;--max:1160px}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:82px;color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:var(--green)}
    .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:13px;min-height:64px;padding:10px max(20px,calc((100vw - var(--max))/2));border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:750;text-decoration:none}.brand img{width:32px;height:32px}.brand span{color:var(--gold);font:650 11px ui-monospace,Consolas,monospace;letter-spacing:.1em}.grow{flex:1}.topbar input{width:min(300px,40vw);min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--text);font:inherit;font-size:12px}.topbar input:focus-visible,.topbar button:focus-visible,.toc-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.topbar button{min-height:40px;padding:7px 13px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--text);font:inherit;font-size:12px;font-weight:650;cursor:pointer}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:30px;width:min(var(--max),100% - 40px);margin:auto;padding:30px 0 80px}.layout.toc-collapsed{grid-template-columns:42px minmax(0,1fr);gap:18px}
    .toc{position:sticky;top:84px;align-self:start;display:grid;gap:5px;max-height:calc(100dvh - 108px);overflow:auto}.toc-head{display:flex;align-items:center;gap:8px}.toc h2{flex:1;margin:0 0 6px;padding:0 10px;color:var(--faint);font:700 10px ui-monospace,Consolas,monospace;letter-spacing:.12em}.toc-toggle{display:flex;align-items:center;justify-content:center;gap:6px;flex:none;min-width:92px;height:34px;margin-bottom:6px;padding:0 9px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);color:var(--text);font:600 12px/1 system-ui,sans-serif;cursor:pointer}.toc-toggle:hover{border-color:color-mix(in srgb,var(--green) 50%,var(--line));background:color-mix(in srgb,var(--green) 10%,var(--panel2))}.toc-toggle-icon{color:var(--green);font-size:18px}.toc-links{display:grid;gap:5px}.toc a{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid transparent;border-radius:4px;color:var(--dim);font-size:12px;text-decoration:none}.toc a b{min-width:40px;color:var(--gold);font:700 12px ui-monospace,Consolas,monospace}.toc a:hover,.toc a.active{border-color:var(--line);background:var(--panel);color:var(--text)}.toc.is-collapsed{width:42px}.toc.is-collapsed .toc-head{justify-content:center}.toc.is-collapsed .toc-head h2,.toc.is-collapsed .toc-links,.toc.is-collapsed .toc-toggle-label{display:none}.toc.is-collapsed .toc-toggle{width:36px;min-width:36px;height:36px;margin:0;padding:0}main{min-width:0}.intro{margin:0 0 18px;padding:24px 26px;border:1px solid var(--line);border-radius:5px;background:linear-gradient(110deg,color-mix(in srgb,var(--green) 8%,var(--panel)),var(--panel) 65%)}.eyebrow{color:var(--green);font:700 10px ui-monospace,Consolas,monospace;letter-spacing:.13em}.intro h1{margin:7px 0 5px;font-size:24px;letter-spacing:-.03em}.intro p{margin:0;color:var(--dim);font-size:13px}.intro #versionScheme{display:inline-flex;margin-top:11px;padding:4px 10px;border:1px solid color-mix(in srgb,var(--green) 35%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--green) 8%,var(--panel));color:var(--green);font-weight:650}.release{margin:0 0 14px;padding:22px 25px;border:1px solid var(--line);border-radius:5px;background:var(--panel);scroll-margin-top:82px}.release h2{display:flex;align-items:baseline;gap:12px;margin:0 0 13px;padding:0 0 12px;border-bottom:1px solid var(--line);font-size:18px}.release h2 span{color:var(--gold);font:700 13px ui-monospace,Consolas,monospace}.release h2 small{margin-left:auto;color:var(--faint);font-size:10px;font-weight:500}.release ul{display:grid;gap:9px;margin:0;padding:0;list-style:none}.release li{position:relative;padding-left:18px;color:var(--dim);font-size:13px;line-height:1.75}.release li::before{position:absolute;left:0;top:.78em;width:5px;height:5px;background:var(--green);content:""}.release[hidden],.toc a[hidden]{display:none}.empty{padding:32px;color:var(--dim);text-align:center}#toTop{position:fixed;right:20px;bottom:20px;display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);color:var(--text);font-size:18px;cursor:pointer}#toTop.show{display:block}
    @media(max-width:760px){.topbar{flex-wrap:wrap;padding:10px 16px}.topbar input{order:3;width:100%;flex:1}.layout,.layout.toc-collapsed{grid-template-columns:1fr;gap:14px;width:calc(100% - 32px);padding-top:18px}.toc{position:static;display:flex;max-height:none;overflow:auto}.toc-head{flex:none}.toc h2{display:none}.toc-links{display:flex}.toc a{flex:none}.toc.is-collapsed{width:100%;height:38px;overflow:hidden}.toc.is-collapsed .toc-head{height:38px}.toc.is-collapsed .toc-links{display:none}.toc.is-collapsed .toc-toggle{height:30px}.release{padding:18px}.release h2{flex-wrap:wrap}.release h2 small{width:100%;margin-left:0}}
  .patch-release{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.patch-release h3{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px;color:var(--gold);font-size:14px}.patch-release h3 small{color:var(--faint);font-weight:400}
    .release-groups{display:grid;gap:24px}.history-heading{margin:0 0 12px;color:var(--text);font-size:15px}.history-group{border-top:1px solid var(--line);padding-top:17px}.history-group>summary{display:flex;align-items:center;gap:12px;min-height:38px;color:var(--text);font-size:15px;font-weight:700;cursor:pointer;list-style-position:inside}.history-group>summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.history-group>summary small{margin-left:auto;color:var(--faint);font-size:11px;font-weight:500}.history-group[open]>summary{margin-bottom:14px}
    /* The version directory starts closed so the release notes stay focused on the current release. */
    .topbar .directory-toggle{display:flex;align-items:center;gap:9px;min-height:42px;padding:8px 14px;border-color:color-mix(in srgb,var(--green) 48%,var(--line));background:color-mix(in srgb,var(--green) 14%,var(--panel));color:var(--text);white-space:nowrap}
    .topbar .directory-toggle:hover{background:color-mix(in srgb,var(--green) 22%,var(--panel))}
    .directory-toggle-icon{color:var(--green);font-size:17px;line-height:1}
    .layout{grid-template-columns:minmax(0,1fr)}.layout.toc-open{grid-template-columns:230px minmax(0,1fr)}
    .toc{display:none;position:sticky;top:84px}.layout.toc-open .toc{display:grid}
    .toc-head{justify-content:space-between}.toc h2{margin:0;color:var(--text);font:650 13px/1.3 system-ui,sans-serif;letter-spacing:0}
    .toc-close{padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--dim);font:inherit;font-size:11px;cursor:pointer}.toc-close:hover{color:var(--text);border-color:var(--green)}
    .toc-alpha{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.toc-alpha summary{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--text);font-size:12px;font-weight:650;cursor:pointer;list-style-position:inside}.toc-alpha summary small{margin-left:auto;color:var(--faint);font-size:10px;font-weight:500}.toc-alpha[open] summary{margin-bottom:5px}.toc-alpha .toc-links{max-height:52vh;overflow:auto}
    .history-group>summary{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);list-style-position:inside}.history-group>summary::marker{color:var(--green)}.history-group[open]>summary{border-color:color-mix(in srgb,var(--green) 45%,var(--line));background:color-mix(in srgb,var(--green) 7%,var(--panel))}
    @media(max-width:760px){.layout,.layout.toc-open{grid-template-columns:minmax(0,1fr)}.layout.toc-open .toc{position:static;max-height:45vh}.toc-alpha .toc-links{max-height:30vh}.topbar .directory-toggle{order:2}.topbar input{order:3}}
  </style>

  <header class="topbar"><a class="brand" href="index.html"><img src="favicon.svg" alt=""><b>GoT</b><span id="brandLabel">更新日志</span></a><div class="grow"></div><button id="directoryToggle" class="directory-toggle" type="button" aria-expanded="false" aria-controls="releaseToc"><span class="directory-toggle-icon" aria-hidden="true">☰</span><span id="directoryToggleLabel">显示版本目录</span></button><input id="search" type="search" placeholder="搜索版本或更新内容" aria-label="搜索更新日志"><button id="languageToggle" type="button" aria-label="Switch language">EN</button></header>
  <div class="layout" id="releaseLayout"><nav class="toc" id="releaseToc" aria-label="版本目录"><div class="toc-head"><h2 id="tocTitle">版本目录</h2><button id="closeDirectory" class="toc-close" type="button">收起目录</button></div><div id="tocFormalLinks" class="toc-links"></div><details class="toc-alpha" id="alphaNavGroup"><summary><span id="alphaNavHeading">Alpha 开发版本</span><small id="alphaNavSummary"></small></summary><div id="tocAlphaLinks" class="toc-links"></div></details></nav><main><section class="intro"><span class="eyebrow">GO · THINK · REVIEW</span><h1 id="pageTitle">GoT 更新日志</h1><p id="pageIntro">记录围棋工作台中与使用体验有关的更新。</p><p id="versionScheme" class="version-mapping"></p></section><div class="release-groups"><section class="release-group" id="officialGroup"><h2 class="history-heading" id="officialHeading">正式版本</h2><div id="officialReleases"></div></section><details id="earlyHistory" class="history-group"><summary><span id="earlyHeading">展开 Alpha 开发历史</span><small id="earlySummary"></small></summary><div id="earlyReleases"></div></details></div><p id="empty" class="empty" hidden>没有找到相关更新。</p></main></div>
  <button id="toTop" type="button" aria-label="回到顶部">↑</button>
  <script>
    (()=>{
      const releases=[{"channel":"release","v":"v1.0.0","date":"2026-09","zhDate":"2026-09 · 对应内部开发版 a2.7.8","enDate":"2026-09 · Based on a2.7.8","zh":"首次公开发布","en":"First Public Release","zhItems":["现代化界面与沉浸式 2D/3D 棋盘。","KataGo 智能分析与 AI 交互教学。","棋谱树浏览与高度个性化的棋盘、棋子主题。"],"enItems":["A modern interface with immersive 2D/3D Go boards.","KataGo analysis and interactive AI lessons.","Game-tree browsing and highly customizable board and stone themes."],"patches":[]},{"v":"a2.7","date":"2026-09","zh":"个性化与人性化","en":"Personalization and usability","zhItems":["对弈与复盘可分别保存面板显示偏好，并选择显示棋盘操作、棋手信息、对局信息和状态提示。","棋谱树主线纵向排列，变化从分叉处进入；支持路径导航，保留原有主线。","3D 棋盘支持快速调整俯视角度、木材色调和棋子形状。","AI 老师支持教学风格、讲解深度和提示方式设置。","加入浏览器内置 KataGo b10c128，提供九档对弈棋力估算。"],"enItems":["Save panel visibility separately for play and review, including board controls, player information, game details and status guidance.","The game tree keeps its main line vertical, with variations entered at their fork and path navigation that preserves the original line.","Quick 3D board controls adjust viewing angle, wood tone and stone shape.","Choose the GoT Tutor’s teaching style, explanation depth and hint approach.","Added the built-in browser KataGo b10c128 with nine estimated playing-strength levels."],"patches":[{"v":"a2.7.1","date":"2026-09","zhItems":["桌面 AI 老师布局自动收起侧栏，将棋盘与讲解区调整为约 60/40，并平滑切换；课堂改为连续对话并显示模型和处理状态。","形势与点目无需先启动 AI 分析；老师输入框按是否有文字切换“讲解当前/发送”。"],"enItems":["The desktop AI Tutor layout collapses the sidebar and gives the board and lesson panel an approximately 60/40 split, with a smoother transition. The tutor uses a continuous conversation and shows its model and activity.","Ownership and scoring work without starting AI analysis. The tutor composer switches between Explain current and Send based on its text."]},{"v":"a2.7.2","date":"2026-09","zhItems":["历史课堂可保存对应棋局、变化路径和棋盘标注；点击讲解可恢复当时局面。","AI 讲解时，顶部收起面板按键原位变为红色边框的结束按键。","优化 AI 讲解的布局过渡；形势与点目结果并入棋盘操作栏，不额外占用棋盘空间。"],"enItems":["Saved lesson history can include the board position, variation path and board marks; select an explanation to restore that position.","During AI explanations, the top-right Collapse panel action becomes a red-outlined End action in place.","Smoothed the AI Tutor layout transition. Ownership and scoring results sit in the board toolbar without taking a separate row."]},{"v":"a2.7.3","date":"2026-09","zhItems":["老师 API 新增自定义供应商，可填写公开 HTTPS API 地址、API Key 与模型 ID；密钥保存在当前浏览器。","个性化设置新增三段式工作区宽度调节；AI 老师课堂继续使用独立布局。"],"enItems":["Added a custom teacher AI provider for public HTTPS APIs, with fields for the API URL, key and model ID. The key stays in this browser.","Added a three-part workspace width control in Personalization; AI Tutor keeps its dedicated layout."]},{"v":"a2.7.4","date":"2026-09","zhItems":["个性化设置新增列表式、结构树和纯净结构树三种棋谱树样式，并在刷新后保留选择。","结构树以节点和连线呈现主线与变化；列表式显示棋步、落子颜色、坐标与当前手。"],"enItems":["Added persistent list, structure tree and clean structure tree styles in Personalization.","Structure trees show connected main lines and variations; the list shows move, stone color, coordinate and current move."]},{"v":"a2.7.5","date":"2026-09","zhItems":["设置标题与左侧分类固定显示，鼠标在设置页面任意位置滚动都可浏览右侧内容。","界面主题单独分组；经典 2D 棋盘外观仅保留棋盘材质与棋子材质，并排展示。3D 外观也集中在个性化中。"],"enItems":["Kept the settings title and category navigation fixed; wheel scrolling anywhere in the dialog moves the settings content.","Separated the interface theme from classic 2D appearance. The 2D board and stone material selectors sit side by side; 3D appearance is also grouped under Personalization."]},{"v":"a2.7.6","date":"2026-09","zhItems":["新增多款原创 2D 棋盘材质与棋子样式；棋盘、棋子可独立搭配，既有样式保留。","新增“金砂沉线”浅金木盘，以明暗边缘呈现凹刻网格，不带中心花纹。","新增“榧纹轻光”暖色细木纹棋盘及原创柔光棋子“玄曜凝光”“贝纹柔光”。","新增琥珀凝光、星砂玄晶、丹漆描金三款高清棋子贴图，按需加载。"],"enItems":["Added original 2D board materials and stone styles that can be mixed independently; existing styles remain available.","Added 金砂沉线, a pale amber board with shallow recessed grid lines and no center ornament.","Added 榧纹轻光, a warm fine-grain board, with the original soft-finish stones 玄曜凝光 and 贝纹柔光.","Added three high-resolution stone sheets—Amber Glow, Stardust Crystal and Cinnabar Gilt—loaded on demand."]},{"v":"a2.7.7","date":"2026-09","zhItems":["新增榧木实景 2D 棋盘照片纹理；网格、星位、坐标和棋子仍由棋盘单独绘制。","新增胡桃木实纹、浅橡木与岩层青石三种独立 3D 盘面纹理；保留所有原有盘面与棋子。","盘面色调、哑光／缎面／抛光光泽、棋子材质与单凸／双凸形状分别选择并保存在本机。","新增山岩石子与高阶云子；新盘面纹理按需载入，并派生法线与粗糙度贴图。撤下两款 2D 棋盘与四款棋子；降低高阶云子反光，并增强山岩石子的明度与哑光质感。增加共享场景光照开关，优化盘面木纹层次与棋子接触阴影。"],"enItems":["Added a photographic kaya texture for the 2D board; grid, star points, coordinates and stones remain separately rendered.","Added distinct walnut, light oak and layered slate textures for 3D, preserving all existing board finishes and stones.","Choose and save board tone, matte/satin/polished gloss, stone material and single-/double-convex shape independently.","Added natural stone and premium Yunzi. New board textures load on demand and derive normal and roughness maps. Withdrawn two 2D boards and four stone styles; reduced premium Yunzi glare and made the natural stone lighter and more matte. Added a shared-scene lighting toggle and improved board grain depth and stone contact shadows."]},{"v":"a2.7.8","date":"2026-09-26","zhItems":["限制异常 SGF 的文件体积、节点数、分支深度和棋盘尺寸；棋谱导出改用迭代遍历，长棋谱局面缓存设定权重上限。","修正课堂快照达到本机存储上限后仍显示可恢复的误导；无法恢复的历史讲解会明确提示。","老师 API Key 改为仅保存在当前标签页会话，并迁移旧版长期存储密钥；发布包补齐 3D 表面模块和离线资源。","修复个性化与工作区测试中过时的断言，补充长棋谱、SGF 边界及密钥迁移回归覆盖。"],"enItems":["Bound SGF size, node count, branch depth and board dimensions; export now traverses iteratively and position caching has a weighted limit.","Lesson history now identifies snapshots that exceeded local storage limits instead of implying they can be restored.","Teacher API keys are kept only for the current tab session, with legacy persistent keys migrated; release bundles now include the 3D surface module and offline assets.","Updated stale personalization and workspace assertions, and added regression coverage for long records, SGF limits and key migration."]}],"channel":"alpha"},{"v":"a2.6","date":"2026-09","zh":"沉浸式棋盘 · 2.5D","en":"Immersive board · 2.5D","zhItems":["新增可调外观的 2.5D 棋盘，默认深色榧木，网格更大、坐标留白更少。","改善黑白棋子的材质、接触阴影和经典棋子高光。","加入落子与提子动画；2D、2.5D 可分别开关，速度可调，默认稍快。"],"enItems":["Added an adjustable 2.5D board with deep kaya by default, a larger grid and tighter coordinate margins.","Refined stone materials, contact shadows and classic stone highlights.","Added placement and capture animations, with independent 2D/2.5D switches and adjustable speed."],"patches":[{"zhItems":["课堂对话保存在当前网站的本机浏览器；新增清除记录入口，并说明会发送给模型服务商的数据与清理范围。","区分网站转发入口和模型列表状态，提示所选模型的实际讲解能力会在课堂请求时确认。","新增温和请求保护：单个服务节点对同一 API Key 每分钟最多处理 60 次老师讲解请求；模型读取和普通对局不受影响，保护服务异常时请求继续放行。"],"enItems":["Lesson conversations stay in this site browser. Added a clear-history action and plain-language details about data sent to the model provider and what clearing removes.","Separated gateway availability from model-list status; the selected model is checked when a lesson request is made.","Added a gentle request guard: up to 60 teacher turns per API key per minute at each serving location. Model discovery and normal games are unaffected, and requests continue if the limiter is unavailable."],"v":"a2.6.1","date":"2026-09"},{"v":"a2.6.2","date":"2026-09","zhItems":["启动时直接使用经典 2D 棋盘；只有手动切换时才初始化 2.5D 与 WebGL。","将 2.5D 材质、Three.js 和大型本地引擎资源改为按需加载，减少首次访问的预缓存负担。"],"enItems":["The app now starts with the classic 2D board; 2.5D and WebGL initialize only after an explicit switch.","2.5D materials, Three.js and large local engine assets are now loaded on demand, reducing first-visit pre-cache work."]},{"v":"a2.6.3","date":"2026-09","zhItems":["设置入口改用齿轮图标。","刷新后恢复的对局可直接继续落子；浏览棋谱分支时仍可使用“从此处续弈”。"],"enItems":["Replaced the settings symbol with a gear icon.","Recovered games are ready for moves after reload; “Play from here” remains available when browsing a record branch."]},{"v":"a2.6.4","date":"2026-09","zhItems":["新版只提醒，使用中的页面不再自行重载；可在设置中手动更新。","修复在线版发布文件缺失的内置引擎与首次访问提示。"],"enItems":["Updates now show a notice without reloading the page in use; you can update manually in Settings.","Restored the bundled engine and first-visit notice in the online release."]},{"v":"a2.6.5","date":"2026-09","zhItems":["补齐 PWA 安装图标与离线资源，在设置中加入安装 GoT 入口；支持的浏览器可由用户主动打开安装提示。"],"enItems":["Added installable PWA icons, offline assets and an Install GoT action in Settings. Supported browsers can show the native install prompt after a user click."]},{"v":"a2.6.6","date":"2026-09","zhItems":["手机切回前台时重新校准并绘制棋盘；手动更新前立即保存当前棋局。","完成 PWA 断网重启与已访问的 2.5D 资源离线检查，并明确老师服务仍需联网。","增加隐私政策与简明使用条款，说明本地保存、老师转发和托管平台的数据边界。","PWA 安装图标改用页面品牌 Logo，安装名称统一为 GoT。"],"enItems":["Recalibrate and redraw the board after returning to the foreground; save the active game before a manual update.","Verified offline restart and previously loaded 2.5D assets, and clarified that the teacher service still requires internet access.","Added a privacy policy and concise terms covering local storage, teacher gateway processing and hosting boundaries.","PWA icons now use the app brand logo, and the installed app is named GoT."]},{"v":"a2.6.7","date":"2026-09","zhItems":["精简关于页与上手说明，集中隐私政策和使用条款的职责，并保留独立入口。"],"enItems":["Simplified About and onboarding content, clarified the roles of the privacy policy and terms, and kept their direct links."]},{"v":"a2.6.8","date":"2026-09","zhItems":["加入自然落点设置，让棋子以固定的轻微偏移呈现；可关闭，不改变棋局坐标。","加入随机木盘落子音效与静音选项；快速回放时避免声音过密。","加入自然日光和柔和室内灯光预设，以及只导出棋盘和棋子的高清 PNG 摄影模式。"],"enItems":["Added an optional, stable slight offset for stone placement; it does not change board coordinates.","Added randomized wooden-board placement sounds and mute control, with sound throttling during fast replay.","Added daylight and soft indoor lighting presets, plus a high-resolution PNG photo mode showing only the board and stones."]},{"v":"a2.6.9","date":"2026-09","zhItems":["升级 2.5D 棋盘材质、棋子模型、光照与画质表现。","新增可调俯视角度与棋盘格范围；正俯视时按经典 2D 棋盘格距校准，设置保存在本机浏览器。"],"enItems":["Updated 2.5D board materials, stone geometry, lighting and quality.","Added adjustable viewing angle and grid span, calibrated to the classic board in top view. Settings are saved in this browser."]},{"v":"a2.6.10","date":"2026-09","zhItems":["点目与形势覆盖统一改为黑白方块；死子位置以对手得分方块标记，不再使用叉号。AI 完成估算后才显示点目标记。","修正 2.5D 标记的透视定位，让点目、形势和分析标记贴合对应交叉点。"],"enItems":["Scoring and ownership overlays now use black and white squares. Dead stones show the opponent’s scoring point without X markers. Scoring markers appear after the AI estimate is ready.","Fixed perspective positioning so scoring, ownership and analysis markers align with their 2.5D intersections."]},{"v":"a2.6.11","date":"2026-09","zhItems":["整理设置分组，统一棋盘设置入口，并同步显示已保存的选项。","新增恢复棋盘默认外观，保留棋局、棋谱、老师密钥和学习记录。","加强本机引擎接口的请求来源与命令校验。"],"enItems":["Organized settings groups, unified board settings entry points and synchronized saved controls.","Added a board appearance reset while keeping games, records, teacher keys and learning progress.","Strengthened origin and command checks on the local engine interface."]}],"channel":"alpha"},{"v":"a2.5","date":"2026-09","zh":"棋盘课堂 · AI 围棋老师","en":"Board lessons · AI Go teacher","zhItems":["新增“气与提子”互动课程和基础死活题教学：棋盘演示、落子作答、渐进提示与课后讲解。","新增 19 路指导棋：你执黑，KataGo 执白；结合落子前后及应手后的评估讲解棋理与下一步方向。","分析与复盘可呼出 AI 老师，支持围绕局面提问、连续追问和回看本机课堂记录。","新增老师棋盘角标与字母标签，坐标与棋盘一致；支持清除标注，局面改变后自动移除旧标记。","精简右侧课堂面板，棋局详情和历史按需展开；统一按钮与滚动交互。课堂回看操作增加明确提示，改善手机答题反馈；复盘页减少重复入口。","优化老师表达，以棋理、观察和提示组织讲解，减少技术术语与机械报分。","支持 DeepSeek API、OpenCode Go 及可用模型读取；改善停止、重试和错误提示；老师等待时区分棋局分析与讲解准备，显示等待时长和较长等待提醒。","将说明拆为简洁的快速预览与独立的详细指南，保留操作演示和常见问题；同步关于与版本信息，说明在线版、本机版和 AI 老师的使用条件。"],"enItems":["Added interactive liberties-and-capture and basic life-and-death lessons with board demonstrations, learner moves and progressive hints.","Added 19×19 guided games: play Black against KataGo, with explanations based on evaluations before and after moves and replies.","Added teacher access from analysis and review, contextual questions, follow-ups and local lesson history.","Added teacher corner marks and letter labels using board coordinates, with manual clearing and automatic removal when positions change.","Simplified the lesson panel with expandable game details and history, consistent buttons and improved scrolling. Added clear lesson navigation feedback, improved mobile answer feedback and reduced duplicate review controls.","Refined teacher explanations around Go ideas, observations and hints, reducing implementation terminology and mechanical score narration.","Added DeepSeek API and OpenCode Go model discovery, with clearer stop, retry and error handling. Teacher feedback now distinguishes position analysis from explanation preparation, with elapsed time and longer-wait guidance.","Separated the short quick preview from a dedicated detailed guide, retaining demonstrations and troubleshooting. Updated About and version details, including online/local differences and teacher requirements."],"patches":[{"v":"a2.5.1","date":"2026-09","zhItems":["棋局自动保存在当前浏览器，重新打开后恢复为暂停状态；重要棋谱仍可导出备份。","老师会随当前局面更新，回看、悔棋或切换课堂时停止旧讲解，减少答非所问。","支持撤回课堂上一手与暂停回看，并可返回课堂继续。","老师密钥改为仅在当前浏览器保存，增加连接验证、删除密钥和更清楚的接入提示；在线版可接入老师服务。","启用三段版本号；后续修复与交互小更新收录在本卡片下方。"],"enItems":["Games are saved in this browser and restored paused. Export important records for a separate backup.","Teacher explanations follow the current position; review, undo and lesson changes cancel outdated work.","Added lesson undo, paused review and return-to-lesson controls.","Teacher keys are now saved only in this browser, with connection verification, key removal and clearer status. Online hosting can provide the teacher gateway.","Introduced three-part version numbers; future fix and interaction revisions appear below in this same card."]},{"v":"a2.5.2","date":"2026-09","zhItems":["老师死活题课堂隐藏并保护普通题库操作，避免查看正解、切换题目或重置棋盘造成课堂错位。","对不在题库已记录变化中的落子，不再直接判错或计入错误记录；说明暂未验证并恢复棋盘，供学生重试记录变化或退出课堂自由研究。","自动撤回课堂中的错误落子时同步清除悔棋检查点。","补齐繁体中文、日文和韩文中的老师设置与缓存确认文案。"],"enItems":["Teacher puzzle lessons now protect their board state from ordinary puzzle controls such as showing the solution, switching problems or resetting.","Moves outside the recorded puzzle variation are no longer marked wrong or counted as mistakes. The lesson explains that the move is unverified, restores the board and lets the learner retry the recorded line or explore outside the lesson.","Automatically rejected lesson moves now clear their undo checkpoint.","Completed Traditional Chinese, Japanese and Korean translations for teacher settings and cache confirmation."]},{"v":"a2.5.3","date":"2026-09","zhItems":["老师等待提示细化为落子前评分、当前局面评分、白棋应手检查、下一手分析和讲解整理等阶段。","长时间等待会说明当前进度、超时处理及重试方式；错误提示区分连接失败、密钥权限、模型不可用和额度问题，并说明棋局与课堂记录会保留。","手动停止讲解时会清理对应计时器，避免过期任务继续触发。"],"enItems":["Teacher status now shows the stages for before-move evaluation, current-position evaluation, White reply checks, next-move analysis and explanation preparation.","Long waits explain what is happening, how timeout and retry work, and whether the board and lesson history are preserved. Errors distinguish connection, key permission, model availability and quota issues.","Stopping an explanation now clears its timer so an expired request cannot trigger later."]}],"channel":"alpha"},{"v":"a2.4","date":"2026-09","zh":"界面与学习体验","en":"Interface and learning experience","zhItems":["重新整理侧边栏与工作区入口，让对弈、学习、棋谱及常用操作更清楚。","优化死活题和棋谱浏览流程，选择题目后直接进入棋盘，浏览棋谱时保持页面风格连贯。","改进新手教程、进阶训练与测评页面，让课程清单、棋盘和练习进度更容易阅读。","统一设置、分析和棋盘工具中的按钮尺寸、间距、颜色与对齐方式。","优化棋盘高光与棋子显示，让落子和局面变化更清晰。","首页和说明页面默认使用深色主题；关于页面集中提供项目介绍、许可信息和更新入口。"],"enItems":["Restructured the sidebar and workspace navigation to make play, learning, records, and common actions easier to find.","Improved problem and game-record browsing, opening selected problems directly on the board and keeping record pages visually consistent.","Refined the beginner tutorial, advanced practice, and assessment pages for clearer lessons, boards, and progress.","Aligned button sizes, spacing, colors, and placement across settings, analysis, and board tools.","Improved board highlights and stone rendering for clearer moves and positions.","Set the home and guide pages to dark mode by default, and brought project, license, and update information together on the About page."],"channel":"alpha"},{"v":"a2.3","date":"2026-09","zh":"编创与分享","en":"Create and share","zhItems":["新增围棋讲义编创工具，可创建题面、讲解、提示、正解和常见误区。","讲义可导出为独立页面，方便分享、离线阅读、练习和打印。","新增 AI 对 AI 观战，可暂停、继续和逐手查看棋局。","改进讲义预览、答案查看和移动设备上的编辑体验。"],"enItems":["Added a Go lesson editor for problems, explanations, hints, solutions, and common mistakes.","Lessons can be exported as standalone pages for sharing, offline reading, practice, and printing.","Added AI-versus-AI games with pause, resume, and move-by-move review.","Improved lesson previews, answer reveal, and editing on mobile devices."],"channel":"alpha"},{"v":"a2.2","date":"2026-09","zh":"学习与移动体验","en":"Learning and mobile experience","zhItems":["新增逐手学习提示，帮助理解提子、连接、气和打吃等局部棋形。","复盘重点可衔接到相关课程与再练内容。","改善手机棋盘操作，支持落子确认、局部放大和全屏使用。","优化浏览器版 KataGo 的加载与使用提示。"],"enItems":["Added move-by-move learning tips for captures, connections, liberties, atari, and other local shapes.","Review focus points now lead to related lessons and follow-up practice.","Improved mobile board controls with move confirmation, local zoom, and full-screen use.","Improved loading and usage guidance for browser-based KataGo."],"channel":"alpha"},{"v":"a2.1","date":"2026-09","zh":"引擎与语言","en":"Engines and languages","zhItems":["提供内置 MCTS、浏览器 KataGo 和本机 KataGo 等对弈与分析选择。","增加繁体中文、英语、日语和韩语界面。","改进触屏落子确认、棋盘缩放和窄屏布局。","重新整理设置入口与显示选项。"],"enItems":["Added built-in MCTS, browser KataGo, and local KataGo options for play and analysis.","Added Traditional Chinese, English, Japanese, and Korean interfaces.","Improved touch move confirmation, board scaling, and narrow-screen layouts.","Reorganized settings and display options."],"channel":"alpha"},{"v":"a2.0","date":"2026-09","zh":"学习路径","en":"Learning paths","zhItems":["新增从新手教程到进阶练习的学习内容。","加入连续对局测评与个人练习记录，帮助安排下一步训练。","扩充精选棋谱，并改进棋谱与死活题的浏览方式。","首页集中显示对局、练习和学习进度入口。"],"enItems":["Added learning content from beginner
